<title>Директоријуми и систем датотека</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
  /* Layout: one column — folder tabs over a question card, progress shown as a file path */
  :root{
    --bg:#eef1f5; --surface:#ffffff; --sunk:#e3e8ee;
    --ink:#131c26; --muted:#5b6b7b; --line:#d6dee6;
    --deep:#16293d; --deep-ink:#dce7f1;
    --folder:#c87f23; --ok:#1c8456; --ok-soft:#e2f2ea;
    --no:#c24529; --no-soft:#fae9e4;
    --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0d141c; --surface:#16202b; --sunk:#111a23;
      --ink:#e7eef5; --muted:#92a3b4; --line:#26323e;
      --deep:#09111a; --deep-ink:#cfe0ee;
      --folder:#e0a14d; --ok:#45c48a; --ok-soft:#123024;
      --no:#e47152; --no-soft:#33190f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d141c; --surface:#16202b; --sunk:#111a23;
    --ink:#e7eef5; --muted:#92a3b4; --line:#26323e;
    --deep:#09111a; --deep-ink:#cfe0ee;
    --folder:#e0a14d; --ok:#45c48a; --ok-soft:#123024;
    --no:#e47152; --no-soft:#33190f;
    color-scheme: dark;
  }
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); line-height:1.55;}
  .wrap{max-width:660px; margin:0 auto;
    padding-left:max(16px, env(safe-area-inset-left, 0px));
    padding-right:max(16px, env(safe-area-inset-right, 0px));
    padding-block:18px 56px;}

  .masthead{background:var(--deep); border-radius:10px; padding:18px 20px 16px; margin-bottom:18px;}
  .masthead h1{margin:0; font-size:1.3rem; font-weight:700; letter-spacing:-.01em; color:#fff; text-wrap:balance;}
  .masthead p{margin:5px 0 0; font-size:.8rem; color:var(--deep-ink); font-family:var(--mono);}

  .tabs{display:flex; gap:4px; align-items:flex-end;}
  .tab{flex:1 1 0; min-width:0; display:flex; align-items:center; gap:8px;
    padding:11px 12px 10px; border:1px solid var(--line); border-bottom:none;
    border-radius:9px 9px 0 0; background:var(--sunk); color:var(--muted);
    font-family:var(--sans); font-size:.86rem; font-weight:600; cursor:pointer; text-align:left;}
  .tab[aria-selected="true"]{background:var(--surface); color:var(--ink); padding-bottom:12px; margin-bottom:-1px;}
  .tab svg{flex:none;}
  .tab span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .panel{background:var(--surface); border:1px solid var(--line); border-radius:0 10px 10px 10px; padding:16px;}

  .path{font-family:var(--mono); font-size:.76rem; color:var(--muted);
    background:var(--sunk); border-radius:6px; padding:7px 10px; margin-bottom:6px;
    overflow-x:auto; white-space:nowrap;}
  .bar{height:5px; background:var(--sunk); border-radius:99px; overflow:hidden; margin-bottom:16px;}
  .bar i{display:block; height:100%; width:0; background:var(--folder); transition:width .3s;}

  .q{font-size:1.06rem; font-weight:600; margin:0 0 14px; text-wrap:balance;}
  .q code{font-family:var(--mono); font-size:.92em; background:var(--sunk); padding:1px 5px; border-radius:4px;}

  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{display:block; width:100%; text-align:left; padding:11px 13px; border-radius:8px;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink);
    font-family:var(--sans); font-size:.95rem; line-height:1.45; cursor:pointer;}
  .opt code{font-family:var(--mono); font-size:.9em;}
  .opt:hover:not(:disabled){border-color:var(--muted);}
  .opt:disabled{cursor:default;}
  .opt:focus-visible{outline:2px solid var(--folder); outline-offset:2px;}
  .opt.ok{border-color:var(--ok); background:var(--ok-soft);}
  .opt.no{border-color:var(--no); background:var(--no-soft);}

  .fb{margin-top:14px; padding:12px 14px; border-radius:8px; background:var(--sunk); font-size:.9rem;}
  .fb b{display:block; margin-bottom:3px; color:var(--ok);}
  .fb.bad b{color:var(--no);}

  .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .btn{padding:10px 18px; border:none; border-radius:8px; background:var(--folder); color:#1b1206;
    font-family:var(--sans); font-weight:700; font-size:.92rem; cursor:pointer;}
  .btn.ghost{background:transparent; color:var(--ink); border:1.5px solid var(--line);}
  .btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

  .score{font-family:var(--mono); font-size:2.6rem; font-weight:600; color:var(--folder);
    margin:8px 0 2px; font-variant-numeric:tabular-nums;}
  .meta{font-size:.82rem; color:var(--muted); margin-top:8px;}
  .eyebrow{font-size:.7rem; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted);}
  @media (prefers-reduced-motion: reduce){ .bar i{transition:none;} }
</style>

<div class="wrap">
  <header class="masthead">
    <h1>Провери себе</h1>
    <p>Оперативни системи · II разред · часови 15 и 16</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-set="0" aria-selected="true">
      <svg width="17" height="14" viewBox="0 0 17 14" aria-hidden="true"><path d="M0 2a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2z" fill="currentColor" opacity=".85"/></svg>
      <span>15 · Директоријуми</span>
    </button>
    <button class="tab" role="tab" data-set="1" aria-selected="false">
      <svg width="17" height="14" viewBox="0 0 17 14" aria-hidden="true"><path d="M0 2a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2z" fill="currentColor" opacity=".85"/></svg>
      <span>16 · Систем датотека</span>
    </button>
  </div>

  <div class="panel">
    <div class="path" id="path">C:\</div>
    <div class="bar"><i id="bar"></i></div>
    <div id="app"></div>
  </div>
</div>

<script>
const SETS = [
 { dir:"cas15", name:"Час 15 — Директоријуми", qs:[
  {q:"Шта тачно пише у директоријуму?",
   o:["Сам садржај датотека, бајт по бајт","Имена датотека и где се оне налазе на диску","Ништа — то је празан простор који чека фајлове"],a:1,
   e:"Директоријум је посебна датотека са списком: име + адреса. Сам садржај фајла лежи другде на диску."},
  {q:"Која од ове две путање је апсолутна?",
   o:["<code>C:\\Users\\Ucenik\\Dokumenti\\rad.txt</code>","<code>..\\Slike\\foto.jpg</code>"],a:0,
   e:"Апсолутна путања почиње од корена (C:\\) и увек важи. Релативна се рачуна од тренутне позиције."},
  {q:"Шта значи ознака <code>..</code> у путањи?",
   o:["Текући фолдер","Фолдер изнад (родитељ)","Корен диска"],a:1,
   e:"Једна тачка је текући фолдер, две тачке су фолдер изнад. Зато <code>cd ..</code> враћа ниво горе."},
  {q:"Која команда исписује стабло директоријума?",
   o:["<code>dir</code>","<code>mkdir</code>","<code>tree</code>"],a:2,
   e:"<code>dir</code> приказује садржај једног фолдера, <code>mkdir</code> прави нови, а <code>tree</code> црта цело стабло."},
  {q:"Зашто четири фајла смеју да се зову <code>zadatak.txt</code> и да се не преписују?",
   o:["Јер имају различите путање","Јер су различите величине","Јер их чува различит корисник"],a:0,
   e:"Име није адреса. Права адреса је цела путања, а она је код сва четири фајла различита."},
  {q:"Налазиш се у <code>OS15\\Vezbe\\Cas15</code>. Како да пређеш у <code>OS15\\Slike</code> без куцања целе путање?",
   o:["<code>cd Slike</code>","<code>cd ..\\..\\Slike</code>","<code>cd \\Slike</code>"],a:1,
   e:"Две тачке те враћају у Vezbe, још две у OS15, па онда улазиш у Slike. То је релативна путања."}
 ]},
 { dir:"cas16", name:"Час 16 — Систем датотека", qs:[
  {q:"USB има 16 GB слободно. Филм је 5 GB. Копирање јавља грешку. Зашто?",
   o:["USB је превише спор за велике фајлове","USB је форматиран у FAT32, а он не подржава фајл већи од 4 GB","Филм је оштећен"],a:1,
   e:"Ограничење није у слободном простору него у систему датотека. Решење је форматирање у NTFS или exFAT."},
  {q:"Шта је кластер?",
   o:["Најмања јединица простора на диску","Име фолдера на диску","Врста диска"],a:0,
   e:"Диск је подељен на кластере једнаке величине, обично 4 KB. Мањи фајл свеједно заузима цео кластер."},
  {q:"Фајл има 1 бајт, а <code>Size on disk</code> показује 4096 бајтова. Зашто?",
   o:["Windows греши у рачунању","Фајл заузима цео кластер, и кад је мањи од њега","Фајл се шири сам од себе"],a:1,
   e:"Неискоришћени део кластера зове се slack space. Зато хиљаду ситних фајлова троши више места него што стварно садрже."},
  {q:"Код ког система датотека постоји картица <code>Security</code> са дозволама?",
   o:["Код свих","Само код FAT32","Код NTFS и ext4 (у Linux-у другачије изгледа)"],a:2,
   e:"FAT32 уопште не чува дозволе. Зато USB форматиран у FAT32 нема ту картицу."},
  {q:"Чему служи журнал (дневник) система датотека?",
   o:["Да убрза рачунар","Да се систем опорави после нестанка струје усред уписа","Да сакрије фајлове од других корисника"],a:1,
   e:"ОС прво упише у дневник шта ће да ради, па тек онда уписује. После квара чита дневник и врати се у исправно стање."},
  {q:"Форматираш USB у ext4 и укључиш га у Windows рачунар. Шта се дешава?",
   o:["Windows га не види без додатног програма","Ради нормално","Windows га аутоматски преформатира"],a:0,
   e:"ext4 је Linux систем датотека. Windows га подразумевано не чита. Зато је FAT32 (или exFAT) и даље избор за USB који иде свуда."}
 ]}
];

let set = 0, i = 0, score = 0, answered = false;
const app = document.getElementById('app');
const bar = document.getElementById('bar');
const pathEl = document.getElementById('path');

const key = () => 'os1516:' + SETS[set].dir;
function saveBest(v){ try{ localStorage.setItem(key(), String(v)); }catch(e){} }
function best(){ try{ return localStorage.getItem(key()); }catch(e){ return null; } }

function chrome(){
  const S = SETS[set], total = S.qs.length;
  const done = Math.min(i, total);
  bar.style.width = Math.round((done / total) * 100) + '%';
  pathEl.textContent = i >= total
    ? 'C:\\OS2\\' + S.dir + '\\rezultat.txt'
    : 'C:\\OS2\\' + S.dir + '\\pitanje_' + String(i + 1).padStart(2, '0') + '  (' + (i + 1) + '/' + total + ')';
}

function render(){
  chrome();
  const S = SETS[set];
  if (i >= S.qs.length){ renderEnd(); return; }
  const Q = S.qs[i];
  answered = false;
  app.innerHTML = '<p class="q">' + Q.q + '</p><div class="opts" id="opts"></div><div id="fb"></div>';
  const boxEl = document.getElementById('opts');
  Q.o.forEach(function(text, idx){
    const b = document.createElement('button');
    b.className = 'opt'; b.type = 'button'; b.innerHTML = text;
    b.addEventListener('click', function(){ pick(idx); });
    boxEl.appendChild(b);
  });
}

function pick(idx){
  if (answered) return;
  answered = true;
  const Q = SETS[set].qs[i];
  const btns = Array.prototype.slice.call(document.querySelectorAll('#opts .opt'));
  btns.forEach(function(b, k){
    b.disabled = true;
    if (k === Q.a) b.classList.add('ok');
    if (k === idx && idx !== Q.a) b.classList.add('no');
  });
  const good = idx === Q.a;
  if (good) score++;
  const fb = document.getElementById('fb');
  fb.className = 'fb' + (good ? '' : ' bad');
  const last = i + 1 >= SETS[set].qs.length;
  fb.innerHTML = '<b>' + (good ? 'Тачно.' : 'Није тачно.') + '</b>' + Q.e
    + '<div class="row"><button class="btn" type="button" id="next">' + (last ? 'Види резултат' : 'Следеће питање') + '</button></div>';
  document.getElementById('next').addEventListener('click', function(){ i++; render(); });
  document.getElementById('next').focus();
}

function renderEnd(){
  const S = SETS[set], total = S.qs.length;
  const prev = best();
  if (prev === null || score > Number(prev)) saveBest(score);
  let poruka;
  if (score === total) poruka = 'Све тачно. Знаш градиво овог часа.';
  else if (score >= total - 1) poruka = 'Скоро све. Прочитај објашњење уз питање које је промашено.';
  else if (score >= total / 2) poruka = 'Половина је ту. Врати се на слике у радном листу и уради квиз поново.';
  else poruka = 'Погледај радни лист и презентацију, па пробај опет.';
  const b = best();
  app.innerHTML = '<p class="eyebrow">' + S.name + '</p>'
    + '<div class="score">' + score + ' / ' + total + '</div>'
    + '<p style="margin:0">' + poruka + '</p>'
    + (b !== null ? '<p class="meta">Твој најбољи резултат: ' + b + ' / ' + total + '</p>' : '')
    + '<div class="row">'
    + '<button class="btn" type="button" id="again">Уради поново</button>'
    + '<button class="btn ghost" type="button" id="other">' + (set === 0 ? 'Пређи на час 16' : 'Пређи на час 15') + '</button>'
    + '</div>'
    + '<p class="meta">Резултат упиши у приватни коментар задатка у Google учионици.</p>';
  document.getElementById('again').addEventListener('click', function(){ i = 0; score = 0; render(); });
  document.getElementById('other').addEventListener('click', function(){ switchSet(set === 0 ? 1 : 0); });
}

function switchSet(n){
  set = n; i = 0; score = 0;
  document.querySelectorAll('.tab').forEach(function(t){
    t.setAttribute('aria-selected', String(Number(t.dataset.set) === n));
  });
  render();
}
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){ switchSet(Number(t.dataset.set)); });
});
render();
</script>
